name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (shared, api, web)
        run: bun run typecheck

      - name: Unit tests (state machine, rate math, geo)
        run: bun test

      - name: Build web
        run: bun run --filter='@lastmile/web' build
